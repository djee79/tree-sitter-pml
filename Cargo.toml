[package]
name = "tree-sitter-pml"
description = "Tree-sitter parser for AVEVA PML2 (Programmable Macro Language)"
version = "0.1.0"
authors = ["Jean-Francois Nantel <jnantelf@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "pml"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/djee79/tree-sitter-pml"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
